name: Validate static site

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate exported site
        shell: pwsh
        run: '& ./scripts/validate-site.ps1'
